<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tasted</title>
  <meta name="description" content="Your food passport: track every country you've tasted.">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F1DFC3" id="theme-color">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tasted">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">

  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dm-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 01 MAP (home) -->
  <section class="screen tab-screen" id="screen-map" aria-label="Map">
    <div class="scroll">
      <div class="stack">
        <div class="topbar">
          <div class="wordmark">tasted<span class="wordmark-dot"></span></div>
          <button class="icon-btn outline" id="map-search" aria-label="Search countries">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
        </div>

        <div class="hero-wrap">
          <div class="label">YOUR FOOD PASSPORT</div>
          <div class="hero">
            <div class="hero-num" id="hero-num">0</div>
            <div class="hero-side">
              <div class="hero-of">/<span id="hero-total">195</span></div>
              <div class="hero-text">countries<br>tasted</div>
            </div>
            <div class="sticker" id="sticker" hidden></div>
          </div>
        </div>

        <div class="map-card">
          <div class="map-card-head">
            <span>WORLD MAP</span>
            <span class="flame-text" id="map-explored">0% EXPLORED</span>
          </div>
          <div class="world" id="world">
            <canvas id="world-canvas" aria-label="Dotted world map"></canvas>
            <div class="pulse pulse-sm" id="world-pulse" hidden></div>
          </div>
          <div class="legend">
            <span><i style="background:var(--flame)"></i>Tasted</span>
            <span><i style="background:var(--tangerine)"></i>Latest</span>
            <span><i style="background:var(--land)"></i>Not yet</span>
          </div>
        </div>

        <div class="h-scroll" id="continent-cards"></div>

        <button class="latest" id="latest"></button>
      </div>
    </div>
  </section>

  <!-- 02 LIST -->
  <section class="screen tab-screen" id="screen-list" aria-label="Countries">
    <div class="list-head">
      <div class="title-row">
        <div class="title-col">
          <div class="label" id="list-count">0 TASTED · 195 TO GO</div>
          <h1 class="title">Countries</h1>
        </div>
        <div class="pct-badge" id="list-pct">0%</div>
      </div>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B4E3A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" aria-label="Search countries" placeholder="Search 195 countries" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>
      <div class="segmented" id="segs">
        <button type="button" data-seg="all" class="on">All</button>
        <button type="button" data-seg="tasted">Tasted</button>
        <button type="button" data-seg="todo">To try</button>
      </div>
      <div class="h-scroll chips" id="chips"></div>
    </div>
    <div class="scroll list-body" id="list-body"></div>
  </section>

  <!-- 04 STATS -->
  <section class="screen tab-screen" id="screen-stats" aria-label="Stats">
    <div class="scroll">
      <div class="stack">
        <div class="title-col">
          <div class="label">YOUR PLATE SO FAR</div>
          <h1 class="title">Stats</h1>
        </div>

        <div class="world-card">
          <div class="world-card-text">
            <div class="label-sm">OF THE WORLD</div>
            <div class="world-pct" id="stats-pct">0%</div>
            <div class="world-sub" id="stats-sub">0 of 195<br>countries tasted</div>
          </div>
          <div class="cells" id="cells"></div>
        </div>

        <div class="section">
          <div class="label">BY CONTINENT</div>
          <div class="bars" id="bars"></div>
        </div>

        <div class="section tight">
          <div class="label">UP NEXT ON YOUR LIST</div>
          <div class="wrap-chips" id="up-next"></div>
        </div>

        <div class="section tight">
          <div class="label">BACKUP</div>
          <div class="backup-row">
            <button type="button" class="outline-pill" id="btn-export">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Export
            </button>
            <label class="outline-pill" id="btn-import">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Import
              <input type="file" id="import-file" accept="application/json,.json" hidden>
            </label>
          </div>
          <div class="note" id="backup-note"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 03 COUNTRY DETAIL -->
  <section class="screen" id="screen-country" aria-label="Country">
    <div class="detail-map" id="detail-map">
      <canvas id="detail-canvas" aria-hidden="true"></canvas>
      <div class="pulse pulse-lg" id="detail-pulse"></div>
    </div>
    <div class="detail-top">
      <button class="icon-btn sand" id="detail-back" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="detail-top-right">
        <button class="icon-btn sand" id="detail-wish" aria-label="Add to wishlist" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
        </button>
        <button class="icon-btn sand" id="detail-share" aria-label="Share">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        </button>
      </div>
    </div>
    <div class="sheet">
      <div class="sheet-scroll">
        <div class="grabber"></div>
        <div class="detail-head">
          <div class="tile tile-lg" id="d-tile"></div>
          <div class="detail-name">
            <h1 id="d-name"></h1>
            <div class="label-sm clay" id="d-region"></div>
          </div>
          <button type="button" class="tasted-pill" id="d-toggle" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="d-toggle-label">Mark tasted</span>
          </button>
        </div>

        <div class="d-section">
          <div class="label" id="d-dish-label">WHAT YOU ATE · 0</div>
          <div class="dish-chips" id="d-dishes"></div>
          <form class="dish-add" id="d-dish-form">
            <label class="dish-input">
              <input type="text" id="d-dish-input" aria-label="Add a dish" placeholder="Add a dish" autocomplete="off" enterkeyhint="done" maxlength="60">
            </label>
            <button type="submit" class="dish-add-btn" aria-label="Add dish">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </form>
        </div>

        <div class="info-grid">
          <label class="info-tile">
            <div class="label-xs">FIRST TASTED</div>
            <div class="info-value" id="d-date-text"></div>
            <input type="date" id="d-date" class="date-overlay" aria-label="First tasted date">
          </label>
          <label class="info-tile">
            <div class="label-xs">WHERE</div>
            <input type="text" id="d-where" class="info-input" placeholder="Add a place" aria-label="Where" autocomplete="off" enterkeyhint="done" maxlength="60">
          </label>
        </div>

        <div class="heat-row">
          <div class="label">HEAT RATING</div>
          <div class="flames" id="d-flames"></div>
        </div>
      </div>
      <div class="save-wrap">
        <button type="button" class="save-btn" id="d-save">Save to passport<span class="save-dot"></span></button>
      </div>
    </div>
  </section>

  <!-- Floating tab bar -->
  <nav class="tabbar" id="tabbar">
    <div class="tab-pill">
      <button class="tab" data-tab="map">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
      <button class="tab" data-tab="list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>List</button>
      <button class="tab" data-tab="stats">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
    </div>
    <button class="fab" id="fab" aria-label="Add a country">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2F1B12" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/store.js"></script>
  <script src="js/dotmap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
